[package]
name = "noeracle-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SEP-40 / Reflector-shaped adapter that wraps the Noeracle pull oracle so safe-oracle can validate it. Synthesizes price history in an on-chain ring buffer (Noeracle exposes only the latest price)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
safe-oracle = { path = "../safe-oracle" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
