name: noeracle-keeper

# Relays Noeracle's signed price attestations on-chain. Each run writes 2
# consecutive ticks per asset (TICKS_PER_RUN), so the adapter ring buffer holds
# 2 fresh timestamps — exactly what safe-oracle's deviation guardrail needs for
# an APPROVED verdict. Data is cryptographically Noeracle's; transport only.
#
# Continuous feeding now runs on an always-on Fly.io worker
# (deploy/keeper-worker/), which avoids cron scheduling jitter. The scheduled
# trigger has been removed; this workflow is kept as a MANUAL backup only
# (run via the Actions "Run workflow" button) for when the worker is down.

on:
  workflow_dispatch: {}

# Never run two relays at once (monotonic round_id makes overlap pointless).
concurrency:
  group: noeracle-keeper
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          sudo mv stellar /usr/local/bin/stellar
          stellar --version

      - name: Configure network + keeper key
        env:
          DEPLOYER_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"
          # Import the keeper secret non-interactively.
          #
          # Stellar CLI 25.1.0's `keys add --secret-key` is a BOOLEAN flag that
          # only PROMPTS for the key on /dev/tty — it does not accept the value
          # as an argument (passing it yields `error: unexpected argument '***'`)
          # and the prompt hangs forever in CI (no TTY). Passing the secret to
          # `--source` inline also leaks it into clap usage-error output.
          #
          # So we write the identity file directly. The CLI stores imported
          # secret keys as `secret_key = "S..."` under <config>/identity/<name>.toml
          # (default config dir on Linux is ~/.config/stellar). The secret comes
          # from the env var below and is NEVER echoed to the log: printf is a
          # shell builtin and its output is redirected straight into the file.
          umask 077
          mkdir -p ~/.config/stellar/identity
          printf 'secret_key = "%s"\n' "$DEPLOYER_SECRET_KEY" > ~/.config/stellar/identity/deployer.toml
          # Sanity-check the alias resolves (prints only the PUBLIC address).
          echo "keeper key imported as: $(stellar keys address deployer)"

      - name: Run keeper
        env:
          NETWORK: testnet
          KEEPER_SOURCE: deployer
        run: bash scripts/keeper.sh
