# Always-on Noeracle keeper worker (testnet feed).
#
# No public service: this is a background worker that relays Noeracle's signed
# attestations on-chain forever. Build context is the repo ROOT (the Dockerfile
# COPYs scripts/keeper.sh), so deploy from the repo root:
#
#   flyctl deploy . --config deploy/keeper-worker/fly.toml \
#                   --dockerfile deploy/keeper-worker/Dockerfile
#
# `app` must be globally unique across Fly.io — change it (and the create/deploy
# commands) if "noeracle-keeper" is taken.
app = "noeracle-keeper"
primary_region = "iad"

[build]
  dockerfile = "deploy/keeper-worker/Dockerfile"

# Background worker process. There is NO [http_service] and NO ports, so there
# is nothing for Fly to scale to zero — the machine runs continuously. This is
# REQUIRED: if the worker ever slept, Noeracle would go stale again.
[processes]
  worker = "bash /app/keeper-loop.sh"

[env]
  NETWORK = "testnet"
  KEEPER_SOURCE = "deployer"
  LOOP_INTERVAL = "150"

# Smallest VM is plenty — the worker is idle (sleeping) most of the time.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]
